<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Controller</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #1a1a1a;
        }
        button {
            padding: 20px 40px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:active {
            background-color: #0056b3;
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <button onclick="sendSignal()">PRESS TO ACTIVATE</button>

    <script>
        function sendSignal() {
            // Replace the URL below with your actual Beeceptor endpoint
            fetch('https://myrobloxbtn.free.beeceptor.com', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ active: true })
            })
            .then(response => console.log('Signal sent!'))
            .catch(error => console.error('Error:', error));
        }
    </script>

</body>
</html>
